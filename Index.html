<!DOCTYPE html>
<html lang="id">
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        min-height: 100vh; width: 100vw; overflow-x: hidden;
        transition: background-color 0.4s ease, color 0.4s ease;
      }

      .ambient-orb {
        position: fixed; border-radius: 50%; filter: blur(100px);
        z-index: -1; opacity: 0; transition: all 0.8s ease; pointer-events: none;
      }
      .orb-1 { top: -100px; left: -100px; width: 500px; height: 500px; }
      .orb-2 { bottom: -100px; right: -100px; width: 600px; height: 600px; }
      .orb-3 { top: 35%; left: 35%; width: 450px; height: 450px; }

      .main-container { padding: 2.2rem 3rem; width: 100%; }

      /* NAVBAR */
      .navbar {
        height: 76px; padding: 0 2.5rem; display: flex; align-items: center;
        justify-content: space-between; position: sticky; top: 0; z-index: 100;
        transition: all 0.3s ease;
      }

      .navbar-brand { display: flex; align-items: center; gap: 14px; cursor: pointer; user-select: none; }
      .brand-text h1 { font-size: 1.15rem; font-weight: 800; line-height: 1.1; letter-spacing: -0.3px; }
      .brand-text p { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; opacity: 0.75; }

      .navbar-user { display: flex; align-items: center; gap: 14px; }
      .user-details { text-align: right; margin-left: 8px; }
      .user-name { font-size: 0.88rem; font-weight: 800; }
      .user-meta { font-size: 0.68rem; font-weight: 600; opacity: 0.7; }
      .user-avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; }

      .theme-switcher {
        padding: 9px 16px; border-radius: 12px; font-weight: 700; font-size: 0.82rem;
        cursor: pointer; outline: none; transition: all 0.3s ease; font-family: inherit;
      }

      .settings-dropdown { position: relative; display: inline-block; }
      .settings-btn {
        width: 38px; height: 38px; border-radius: 12px; cursor: pointer;
        display: flex; align-items: center; justify-content: center; font-size: 1.1rem;
        transition: all 0.3s ease; outline: none;
      }
      .settings-menu {
        position: absolute; top: 125%; right: 0; width: 240px;
        opacity: 0; visibility: hidden; transform: translateY(10px);
        transition: all 0.3s ease; z-index: 200; border-radius: 14px;
        display: flex; flex-direction: column; overflow: hidden; padding: 6px;
      }
      .settings-menu.show { opacity: 1; visibility: visible; transform: translateY(0); }
      .settings-menu a {
        padding: 12px 14px; text-decoration: none; display: flex; align-items: center; gap: 12px;
        font-size: 0.82rem; font-weight: 700; border-radius: 8px; transition: all 0.2s ease;
      }
      .menu-divider { height: 1px; width: 100%; margin: 6px 0; }

      .btn-logout {
        padding: 9px 16px; border-radius: 12px; font-weight: 800; font-size: 0.82rem;
        cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.3s ease;
        margin-left: 6px; font-family: inherit; text-transform: uppercase;
      }

      /* CORE CARD GRID STYLES */
      .cards-grid {
        display: grid !important;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)) !important;
        gap: 20px !important; width: 100% !important;
      }

      .card-item {
        position: relative !important; height: 145px !important; padding: 18px 14px !important;
        display: flex !important; flex-direction: column !important; align-items: center !important;
        justify-content: center !important; gap: 12px !important; cursor: pointer !important;
        overflow: hidden !important; user-select: none !important; z-index: 1 !important;
        border-radius: 16px !important; transition: transform 0.25s ease, box-shadow 0.25s ease !important;
      }

      .card-icon {
        width: 48px !important; height: 48px !important; border-radius: 10px !important;
        display: flex !important; align-items: center !important; justify-content: center !important;
        font-size: 1.4rem !important; z-index: 3 !important; position: relative !important;
        flex-shrink: 0 !important; transition: all 0.25s ease !important;
      }

      .card-title {
        font-size: 0.78rem !important; font-weight: 800 !important; text-align: center !important;
        letter-spacing: 0.4px !important; line-height: 1.25 !important; z-index: 3 !important;
        position: relative !important; text-transform: uppercase !important;
      }

      .card-watermark {
        position: absolute !important; right: -10px !important; bottom: -15px !important;
        font-size: 90px !important; pointer-events: none !important; z-index: 1 !important;
        transform: rotate(-10deg) !important; transition: transform 0.3s ease !important; line-height: 1 !important;
      }

      .card-item:hover .card-watermark { transform: rotate(0deg) scale(1.08) !important; }

      /* PROGRESS BAR & MODALS */
      .custom-modal-overlay {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
        display: flex; align-items: center; justify-content: center; z-index: 2000;
        opacity: 0; visibility: hidden; transition: all 0.3s ease;
      }
      .custom-modal-overlay.show { opacity: 1; visibility: visible; }

      .custom-modal-box {
        width: 90%; max-width: 440px; padding: 28px; border-radius: 20px;
        text-align: center; transform: translateY(20px); transition: all 0.3s ease;
      }
      .custom-modal-overlay.show .custom-modal-box { transform: translateY(0); }

      .progress-bar-container { width: 100%; height: 16px; border-radius: 10px; overflow: hidden; margin: 20px 0 10px 0; position: relative; }
      .progress-bar-fill { height: 100%; width: 0%; transition: width 0.1s linear; border-radius: 10px; }
      .progress-percent { font-size: 1.1rem; font-weight: 800; margin-top: 6px; }

      .confirm-btn-group { display: flex; gap: 12px; justify-content: center; margin-top: 24px; }
      .confirm-btn { padding: 10px 22px; border-radius: 12px; font-weight: 800; font-size: 0.85rem; cursor: pointer; transition: all 0.2s ease; border: none; }

      /* ADAPTASI 7 TEMA */
      body.theme-brutalism { background-color: #FFFBEB; color: #000; font-family: 'Space Grotesk', sans-serif; }
      body.theme-brutalism .navbar { background: #FFFFFF; border-bottom: 4px solid #000; box-shadow: 0 5px 0 #000; }
      body.theme-brutalism .brand-logo { background: #FFDE59; border: 3px solid #000; box-shadow: 3px 3px 0 #000; width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; color: #000; }
      body.theme-brutalism .theme-switcher { background: #A3E635; border: 3px solid #000; color: #000; box-shadow: 3px 3px 0 #000; }
      body.theme-brutalism .settings-btn { background: #38BDF8; border: 3px solid #000; color: #000; box-shadow: 3px 3px 0 #000; }
      body.theme-brutalism .settings-menu { background: #FFFFFF; border: 3.5px solid #000; box-shadow: 6px 6px 0 #000; }
      body.theme-brutalism .settings-menu a { color: #000; }
      body.theme-brutalism .settings-menu a:hover { background: #FFDE59; }
      body.theme-brutalism .menu-divider { background: #000; height: 2px; }
      body.theme-brutalism .text-danger { color: #FF0000 !important; }
      body.theme-brutalism .btn-logout { background: #FF6B6B; color: #FFF; border: 3px solid #000; box-shadow: 3px 3px 0 #000; }
      body.theme-brutalism .card-item { background-color: var(--brutal-color, #FFDE59) !important; border: 3.5px solid #000000 !important; box-shadow: 5px 5px 0px #000000 !important; color: #000000 !important; }
      body.theme-brutalism .card-item:hover { transform: translate(-4px, -4px) !important; box-shadow: 9px 9px 0px #000000 !important; }
      body.theme-brutalism .card-icon { background: #FFFFFF !important; border: 2.5px solid #000000 !important; color: #000000 !important; box-shadow: 2.5px 2.5px 0px #000000 !important; }
      body.theme-brutalism .card-watermark { color: #000000 !important; opacity: 0.07 !important; }
      body.theme-brutalism .custom-modal-box { background: #FFFFFF; border: 4px solid #000; box-shadow: 8px 8px 0 #000; }
      body.theme-brutalism .progress-bar-container { background: #e2e8f0; border: 2.5px solid #000; }
      body.theme-brutalism .progress-bar-fill { background: #A3E635; border-right: 2px solid #000; }
      body.theme-brutalism .btn-confirm-yes { background: #FF6B6B; border: 3px solid #000; color: #FFF; box-shadow: 3px 3px 0 #000; }
      body.theme-brutalism .btn-confirm-no { background: #CBD5E1; border: 3px solid #000; color: #000; box-shadow: 3px 3px 0 #000; }

      body.theme-glass-light { background-color: #f1f5f9; color: #0f172a; }
      body.theme-glass-light .ambient-orb { opacity: 1; }
      body.theme-glass-light .orb-1 { background: rgba(56, 189, 248, 0.45); } body.theme-glass-light .orb-2 { background: rgba(244, 114, 182, 0.4); } body.theme-glass-light .orb-3 { background: rgba(253, 224, 71, 0.35); }
      body.theme-glass-light .navbar { background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(25px); border-bottom: 1px solid rgba(255, 255, 255, 0.9); box-shadow: 0 10px 30px rgba(0,0,0,0.03); }
      body.theme-glass-light .brand-logo { background: rgba(255, 255, 255, 0.8); border: 1px solid #fff; backdrop-filter: blur(10px); color: #2563eb; width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.15); }
      body.theme-glass-light .theme-switcher, body.theme-glass-light .settings-btn { background: rgba(255,255,255,0.7); backdrop-filter: blur(10px); border: 1px solid #fff; color: #0f172a; }
      body.theme-glass-light .settings-menu { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(25px); border: 1px solid #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
      body.theme-glass-light .settings-menu a { color: #1e293b; }
      body.theme-glass-light .settings-menu a:hover { background: rgba(59, 130, 246, 0.1); color: #2563eb; }
      body.theme-glass-light .menu-divider { background: rgba(0,0,0,0.08); }
      body.theme-glass-light .text-danger { color: #ef4444 !important; }
      body.theme-glass-light .btn-logout { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.4); backdrop-filter: blur(10px); }
      body.theme-glass-light .card-item { background: rgba(255, 255, 255, 0.55) !important; backdrop-filter: blur(20px) !important; border: 1px solid rgba(255, 255, 255, 0.85) !important; color: #0f172a !important; box-shadow: 0 10px 30px rgba(31, 38, 135, 0.05) !important; }
      body.theme-glass-light .card-item:hover { transform: translateY(-7px) !important; background: rgba(255, 255, 255, 0.85) !important; box-shadow: 0 20px 40px rgba(0,0,0,0.08) !important; }
      body.theme-glass-light .card-icon { background: rgba(37, 99, 235, 0.12) !important; border: 1px solid rgba(255,255,255,0.8) !important; color: #2563eb !important; }
      body.theme-glass-light .card-watermark { color: #1e293b !important; opacity: 0.06 !important; }
      body.theme-glass-light .custom-modal-box { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(25px); border: 1px solid #fff; }
      body.theme-glass-light .progress-bar-container { background: rgba(0,0,0,0.06); }
      body.theme-glass-light .progress-bar-fill { background: #2563eb; }
      body.theme-glass-light .btn-confirm-yes { background: #ef4444; color: #fff; }
      body.theme-glass-light .btn-confirm-no { background: rgba(0,0,0,0.08); color: #0f172a; }

      body.theme-glass-dark { background-color: #0b0f19; color: #fff; }
      body.theme-glass-dark .ambient-orb { opacity: 1; }
      body.theme-glass-dark .orb-1 { background: rgba(37, 99, 235, 0.5); } body.theme-glass-dark .orb-2 { background: rgba(147, 51, 234, 0.45); } body.theme-glass-dark .orb-3 { background: rgba(6, 182, 212, 0.35); }
      body.theme-glass-dark .navbar { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(25px); border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
      body.theme-glass-dark .brand-logo { background: rgba(59, 130, 246, 0.25); border: 1px solid rgba(255,255,255,0.25); color: #60a5fa; width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
      body.theme-glass-dark .theme-switcher option { color: #000; }
      body.theme-glass-dark .theme-switcher, body.theme-glass-dark .settings-btn { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); color: #fff; }
      body.theme-glass-dark .settings-menu { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
      body.theme-glass-dark .settings-menu a { color: #e2e8f0; }
      body.theme-glass-dark .settings-menu a:hover { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
      body.theme-glass-dark .menu-divider { background: rgba(255,255,255,0.1); }
      body.theme-glass-dark .text-danger { color: #f87171 !important; }
      body.theme-glass-dark .btn-logout { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }
      body.theme-glass-dark .card-item { background: rgba(255, 255, 255, 0.06) !important; backdrop-filter: blur(20px) !important; border: 1px solid rgba(255, 255, 255, 0.15) !important; color: #fff !important; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4) !important; }
      body.theme-glass-dark .card-item:hover { transform: translateY(-7px) !important; background: rgba(255, 255, 255, 0.12) !important; box-shadow: 0 20px 40px rgba(0,0,0,0.5) !important; }
      body.theme-glass-dark .card-icon { background: rgba(59, 130, 246, 0.2) !important; border: 1px solid rgba(59,130,246,0.35) !important; color: #60a5fa !important; }
      body.theme-glass-dark .card-watermark { color: #ffffff !important; opacity: 0.07 !important; }
      body.theme-glass-dark .custom-modal-box { background: rgba(15,23,42,0.9); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.2); }
      body.theme-glass-dark .progress-bar-container { background: rgba(255,255,255,0.1); }
      body.theme-glass-dark .progress-bar-fill { background: #60a5fa; }

      body.theme-premium { background-color: #f8fafc; color: #0f172a; }
      body.theme-premium .navbar { background: #ffffff; border-bottom: 1px solid #e2e8f0; box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
      body.theme-premium .brand-logo { background: linear-gradient(135deg, #1d4ed8, #3b82f6); color: white; width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
      body.theme-premium .theme-switcher, body.theme-premium .settings-btn { background: #f1f5f9; border: 1px solid #cbd5e1; color: #1e293b; }
      body.theme-premium .settings-menu { background: #fff; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
      body.theme-premium .settings-menu a { color: #334155; }
      body.theme-premium .settings-menu a:hover { background: #f1f5f9; color: #1d4ed8; }
      body.theme-premium .menu-divider { background: #e2e8f0; }
      body.theme-premium .text-danger { color: #dc2626 !important; }
      body.theme-premium .btn-logout { background: #fff; color: #dc2626; border: 1px solid #dc2626; }

      body.theme-premium .card-icon { background: rgba(255,255,255,0.15) !important; border-radius: 12px !important; color: white !important; border: none !important; }
      body.theme-premium .card-watermark { color: #ffffff !important; opacity: 0.1 !important; }
      body.theme-premium .custom-modal-box { background: #fff; border: 1px solid #e2e8f0; }
      body.theme-premium .progress-bar-container { background: #e2e8f0; }
      body.theme-premium .progress-bar-fill { background: #1d4ed8; }

      body.theme-cyberpunk { background-color: #050508; color: #fff; font-family: 'Space Grotesk', sans-serif; }
      body.theme-cyberpunk .navbar { background: #0c0d12; border-bottom: 2px solid #00f0ff; box-shadow: 0 0 15px rgba(0,240,255,0.25); }
      body.theme-cyberpunk .brand-logo { background: #000; border: 2px solid #ff007f; color: #ff007f; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 10px #ff007f;}
      body.theme-cyberpunk .theme-switcher option { color: #000; }
      body.theme-cyberpunk .theme-switcher, body.theme-cyberpunk .settings-btn { background: #000; border: 2px solid #00f0ff; color: #00f0ff; }
      body.theme-cyberpunk .settings-menu { background: #050508; border: 2px solid #00f0ff; box-shadow: 0 0 15px rgba(0,240,255,0.3); }

      body.theme-cyberpunk .menu-divider { background: #00f0ff; }
      body.theme-cyberpunk .text-danger { color: #ff007f !important; }
      body.theme-cyberpunk .btn-logout { background: #000; color: #ff007f; border: 2px solid #ff007f; }
      body.theme-cyberpunk .card-item { background: #0f1015 !important; border: 1px solid #222 !important; border-left: 4px solid #00f0ff !important; border-radius: 6px !important; color: #fff !important; box-shadow: 0 6px 15px rgba(0,0,0,0.6) !important; }
      body.theme-cyberpunk .card-icon { background: transparent !important; color: #ff007f !important; border: none !important; text-shadow: 0 0 10px #ff007f !important; }
      body.theme-cyberpunk .card-watermark { color: #00f0ff !important; opacity: 0.08 !important; }
      body.theme-cyberpunk .custom-modal-box { background: #000; border: 2px solid #00f0ff; box-shadow: 0 0 20px rgba(0,240,255,0.4); }
      body.theme-cyberpunk .progress-bar-container { background: #111; border: 1px solid #ff007f; }
      body.theme-cyberpunk .progress-bar-fill { background: #00f0ff; }

      body.theme-aurora { background: linear-gradient(125deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb); background-size: 300% 300%; animation: auroraAnimation 12s ease infinite; color: #0f172a; }
      @keyframes auroraAnimation { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
      body.theme-aurora .navbar { background: rgba(255,255,255,0.75); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255,255,255,0.6); }
      body.theme-aurora .brand-logo { background: #fff; color: #ff758c; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }

      body.theme-aurora .card-watermark { color: #0f172a !important; opacity: 0.05 !important; }
      body.theme-aurora .custom-modal-box { background: rgba(255,255,255,0.95); border: 1px solid #fff; }
      body.theme-aurora .progress-bar-container { background: #f1f5f9; }

      body.theme-neumorphism { background-color: #e2e8f0; color: #1e293b; }
      body.theme-neumorphism .navbar { background: #e2e8f0; border: none; box-shadow: 8px 8px 16px #cbd5e1, -8px -8px 16px #ffffff; }
      body.theme-neumorphism .brand-logo { background: #e2e8f0; color: #2563eb; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 4px 4px 8px #cbd5e1, -4px -4px 8px #ffffff;}
      body.theme-neumorphism .theme-switcher, body.theme-neumorphism .settings-btn { background: #e2e8f0; border: none; color: #1e293b; box-shadow: inset 3px 3px 6px #cbd5e1, inset -3px -3px 6px #ffffff; }
      body.theme-neumorphism .settings-menu { background: #e2e8f0; border: none; box-shadow: 8px 8px 16px #cbd5e1, -8px -8px 16px #ffffff; padding: 10px; }

      body.theme-neumorphism .menu-divider { background: #cbd5e1; box-shadow: 0 1px 0 #fff; }
      body.theme-neumorphism .text-danger { color: #e11d48 !important; }
      body.theme-neumorphism .btn-logout { background: #e2e8f0; color: #e11d48; border: none; box-shadow: 4px 4px 8px #cbd5e1, -4px -4px 8px #ffffff; }
      body.theme-neumorphism .card-item { background: #e2e8f0 !important; color: #1e293b !important; border: none !important; box-shadow: 8px 8px 18px #cbd5e1, -8px -8px 18px #ffffff !important; }
      body.theme-neumorphism .card-icon { background: #e2e8f0 !important; box-shadow: inset 4px 4px 8px #cbd5e1, inset -4px -4px 8px #ffffff !important; border-radius: 50% !important; color: #2563eb !important; border: none !important; }
      body.theme-neumorphism .card-watermark { display: none !important; }
      body.theme-neumorphism .custom-modal-box { background: #e2e8f0; box-shadow: 12px 12px 24px #cbd5e1, -12px -12px 24px #ffffff; }
      body.theme-neumorphism .progress-bar-container { background: #e2e8f0; box-shadow: inset 4px 4px 8px #cbd5e1, inset -4px -4px 8px #ffffff; }
      body.theme-neumorphism .progress-bar-fill { background: #2563eb; }

      /* TOAST NOTIFICATION */
      .toast { position: fixed; bottom: 30px; right: 30px; padding: 14px 24px; border-radius: 12px; font-weight: 700; display: flex; align-items: center; gap: 12px; transform: translateY(150px); opacity: 0; transition: all 0.4s ease; z-index: 3000; }
      .toast.show { transform: translateY(0); opacity: 1; }
      .theme-brutalism .toast { background: #FFDE59; color: #000; border: 3px solid #000; box-shadow: 5px 5px 0 #000; }
      .theme-glass-light .toast { background: rgba(255,255,255,0.85); backdrop-filter: blur(10px); color: #0f172a; border: 1px solid #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
      .theme-glass-dark .toast { background: rgba(15,23,42,0.85); backdrop-filter: blur(10px); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
      .theme-premium .toast { background: #1e293b; color: white; }
      .theme-cyberpunk .toast { background: #000; color: #00f0ff; border: 1px solid #00f0ff; box-shadow: 0 0 10px #00f0ff; }
      .theme-aurora .toast { background: rgba(255,255,255,0.9); color: #0f172a; }
      .theme-neumorphism .toast { background: #e2e8f0; color: #1e293b; box-shadow: 6px 6px 12px #cbd5e1, -6px -6px 12px #ffffff; }
    </style>
  </head>
  
  <body class="theme-brutalism">
    
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>

    <!-- NAVBAR (LOGGED IN) -->
    <nav class="navbar" id="appNavbar" style="display: none;">
      <div class="navbar-brand" onclick="navigatePage('Dashboard', 'Dashboard')" title="Kembali ke Dashboard Utama">
        <div class="brand-logo"><i class="fa-solid fa-shapes"></i></div>
        <div class="brand-text">
          <h1>ACC MANAGEMENT SISTEM</h1>
          <p>Operations Dashboard</p>
        </div>
      </div>

      <div class="navbar-user">
        <select id="themeSelector" class="theme-switcher" onchange="changeTheme(this.value)">
          <option value="theme-brutalism">Neo-Brutalism (Default)</option>
          <option value="theme-glass-light">Light Glassmorphism</option>
          <option value="theme-glass-dark">Dark Glassmorphism</option>
          <option value="theme-premium">Corporate Premium</option>
          <option value="theme-cyberpunk">Cyberpunk Neon</option>
          <option value="theme-aurora">Aurora Gradient</option>
          <option value="theme-neumorphism">Soft Neumorphism</option>
        </select>

        <div class="settings-dropdown">
          <button class="settings-btn" title="Pengaturan Data" onclick="toggleSettingsMenu(event)">
            <i class="fa-solid fa-gear"></i>
          </button>
          <div class="settings-menu" id="settingsMenu">
            <div style="padding: 12px; text-align: center; font-size: 0.8rem; opacity: 0.7;">Memuat menu...</div>
          </div>
        </div>

        <div class="user-details">
          <div class="user-name" id="currentUserName">User</div>
          <div class="user-meta" id="currentUserMeta">USR-000 | email@acc.com</div>
        </div>
        <img class="user-avatar" id="currentUserAvatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=User" alt="Avatar">

        <button class="btn-logout" id="btnLogout" onclick="handleLogout()" title="Keluar">
          <i class="fa-solid fa-right-from-bracket"></i> Logout
        </button>
      </div>
    </nav>

    <!-- MAIN SPA CONTAINER -->
    <main class="main-container" id="mainContent"></main>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="toast">
      <i class="fa-solid fa-circle-check"></i>
      <span id="toast-message">Notifikasi</span>
    </div>

    <!-- CUSTOM CONFIRM MODAL -->
    <div class="custom-modal-overlay" id="confirmModal">
      <div class="custom-modal-box">
        <i class="fa-solid fa-triangle-exclamation" style="font-size: 3rem; color: #ef4444; margin-bottom: 12px;"></i>
        <h3 id="confirmTitle" style="font-size: 1.25rem; font-weight: 800; margin-bottom: 8px;">Konfirmasi Hapus</h3>
        <p id="confirmMessage" style="font-size: 0.88rem; opacity: 0.8; line-height: 1.4;">Apakah Anda yakin ingin melakukan tindakan ini?</p>
        <div class="confirm-btn-group">
          <button class="confirm-btn btn-confirm-no" onclick="closeConfirmModal(false)">Batal</button>
          <button class="confirm-btn btn-confirm-yes" id="confirmActionBtn">Ya, Lanjutkan</button>
        </div>
      </div>
    </div>

    <!-- LOADING PROGRESS BAR OVERLAY -->
    <div class="custom-modal-overlay" id="progressOverlay">
      <div class="custom-modal-box" style="max-width: 380px;">
        <i class="fa-solid fa-spinner fa-spin" style="font-size: 2.2rem; margin-bottom: 12px;"></i>
        <h4 id="progressTitle" style="font-size: 1rem; font-weight: 800; text-transform: uppercase;">Memuat Data...</h4>
        <div class="progress-bar-container">
          <div class="progress-bar-fill" id="progressBarFill"></div>
        </div>
        <div class="progress-percent" id="progressPercentText">0%</div>
      </div>
    </div>

    <script>
      let globalActiveMenus = { gridMenus: [], settingsMenus: [] };
      let menuDataList = []; 
      let rawUserList = [];
      let rawKaryawanList = [];
      let currentUser = null;
      let confirmCallback = null;

      /* ====================================================================
         INACTIVITY SESSION TIMEOUT (15 MENIT AUTO-LOGOUT)
         ==================================================================== */
      let inactivityTimer = null;
      const INACTIVITY_LIMIT = 15 * 60 * 1000; // 15 Menit dalam milidetik

      function resetInactivityTimer() {
        if (inactivityTimer) clearTimeout(inactivityTimer);

        // Hanya aktifkan timer jika user sedang terautentikasi / login
        const sessionStr = localStorage.getItem('accUserSession');
        if (sessionStr) {
          inactivityTimer = setTimeout(triggerInactivityLogout, INACTIVITY_LIMIT);
        }
      }

      function triggerInactivityLogout() {
        const sessionStr = localStorage.getItem('accUserSession');
        if (!sessionStr) return;

        showToast('Sesi Anda telah berakhir karena tidak ada aktivitas selama 15 menit.');

        setTimeout(() => {
          localStorage.removeItem('accUserSession');
          sessionStorage.clear();
          showLoginPage();
        }, 1200);
      }

      // Pasang event listener aktivitas pengguna di seluruh elemen window
      const userActivityEvents = ['mousemove', 'keydown', 'click', 'scroll', 'touchstart'];
      userActivityEvents.forEach(eventName => {
        window.addEventListener(eventName, resetInactivityTimer, { passive: true });
      });

      document.addEventListener("DOMContentLoaded", function() {
        const savedTheme = localStorage.getItem('accSystemTheme') || 'theme-brutalism';
        document.body.className = savedTheme;
        const sel = document.getElementById('themeSelector');
        if (sel) sel.value = savedTheme;

        checkUserSession();
        resetInactivityTimer();
      });

      function changeTheme(themeName) {
        document.body.className = themeName;
        localStorage.setItem('accSystemTheme', themeName); 
      }

      function showToast(message) {
        const toast = document.getElementById('toast');
        document.getElementById('toast-message').innerText = message;
        toast.classList.add('show');
        setTimeout(() => { toast.classList.remove('show'); }, 3500);
      }

      function showCustomConfirm(title, message, onYesCallback) {
        document.getElementById('confirmTitle').innerText = title;
        document.getElementById('confirmMessage').innerText = message;
        confirmCallback = onYesCallback;
        document.getElementById('confirmModal').classList.add('show');
      }

      function closeConfirmModal(proceed) {
        document.getElementById('confirmModal').classList.remove('show');
        if (proceed && typeof confirmCallback === 'function') {
          confirmCallback();
        }
        confirmCallback = null;
      }

      document.getElementById('confirmActionBtn').addEventListener('click', function() {
        closeConfirmModal(true);
      });

      function runProgressBar(titleText, durationMs, onComplete) {
        const overlay = document.getElementById('progressOverlay');
        const fill = document.getElementById('progressBarFill');
        const text = document.getElementById('progressPercentText');
        document.getElementById('progressTitle').innerText = titleText;

        fill.style.width = '0%';
        text.innerText = '0%';
        overlay.classList.add('show');

        let current = 0;
        const intervalTime = 25;
        const increment = 100 / (durationMs / intervalTime);

        const timer = setInterval(() => {
          current += increment;
          if (current >= 100) {
            current = 100;
            fill.style.width = '100%';
            text.innerText = '100%';
            clearInterval(timer);
            setTimeout(() => {
              overlay.classList.remove('show');
              if (typeof onComplete === 'function') onComplete();
            }, 180);
          } else {
            fill.style.width = Math.floor(current) + '%';
            text.innerText = Math.floor(current) + '%';
          }
        }, intervalTime);
      }

      /* ====================================================================
         AUTH SESSION LOGIC
         ==================================================================== */
      function checkUserSession() {
        const sessionStr = localStorage.getItem('accUserSession');
        if (sessionStr) {
          try {
            currentUser = JSON.parse(sessionStr);
            document.getElementById('appNavbar').style.display = 'flex';
            updateNavbarUserInfo();
            refreshAllDynamicMenus();
            resetInactivityTimer();
            navigatePage('Dashboard', 'Dashboard');
          } catch(e) {
            showLoginPage();
          }
        } else {
          showLoginPage();
        }
      }

      function showLoginPage() {
        currentUser = null;
        if (inactivityTimer) clearTimeout(inactivityTimer);
        document.getElementById('appNavbar').style.display = 'none';
        
        runProgressBar('Memuat Halaman Login...', 300, function() {
          google.script.run
            .withSuccessHandler(function(htmlContent) {
              document.getElementById('mainContent').innerHTML = htmlContent;
            })
            .loadPage('Page_Login', 'Login');
        });
      }

      function handleAuthLogin(e) {
        e.preventDefault();
        const userVal = document.getElementById('loginUser').value;
        const passVal = document.getElementById('loginPass').value;
        const btnSubmit = document.getElementById('btnLoginSubmit');

        if (!userVal || !passVal) return;

        if (btnSubmit) {
          btnSubmit.classList.add('loading-state');
          btnSubmit.disabled = true;
          btnSubmit.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> MEMVERIFIKASI...`;
        }

        google.script.run
          .withSuccessHandler(function(res) {
            if (res.status === 'success') {
              if (btnSubmit) btnSubmit.innerHTML = `<i class="fa-solid fa-circle-check"></i> BERHASIL!`;
              showToast(res.message);
              currentUser = res.user;
              localStorage.setItem('accUserSession', JSON.stringify(currentUser));
              
              document.getElementById('appNavbar').style.display = 'flex';
              updateNavbarUserInfo();
              refreshAllDynamicMenus();
              resetInactivityTimer();
              
              setTimeout(() => {
                navigatePage('Dashboard', 'Dashboard');
              }, 400);
            } else {
              showToast(res.message);
              if (btnSubmit) {
                btnSubmit.classList.remove('loading-state');
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = `<i class="fa-solid fa-right-to-bracket"></i> Masuk ke Sistem`;
              }
            }
          })
          .withFailureHandler(function(err) {
            showToast('Gagal terhubung ke server: ' + err.message);
            if (btnSubmit) {
              btnSubmit.classList.remove('loading-state');
              btnSubmit.disabled = false;
              btnSubmit.innerHTML = `<i class="fa-solid fa-right-to-bracket"></i> Masuk ke Sistem`;
            }
          })
          .processLogin(userVal, passVal);
      }

      function updateNavbarUserInfo() {
        if (!currentUser) return;
        document.getElementById('currentUserName').innerText = currentUser.name || 'User';
        document.getElementById('currentUserMeta').innerText = (currentUser.id || '') + ' | ' + (currentUser.username || '');
        const cleanName = (currentUser.name || 'User').replace(/[^a-zA-Z0-9]/g, '');
        document.getElementById('currentUserAvatar').src = 'https://api.dicebear.com/7.x/avataaars/svg?seed=' + cleanName;
      }

      function handleLogout() {
        showCustomConfirm("Konfirmasi Keluar", "Apakah Anda yakin ingin keluar dari sistem?", function() {
          runProgressBar('Mengakhiri Sesi...', 400, function() {
            if (inactivityTimer) clearTimeout(inactivityTimer);
            localStorage.removeItem('accUserSession');
            sessionStorage.clear();
            showToast('Sesi berhasil diakhiri.');
            showLoginPage();
          });
        });
      }

      /* ====================================================================
         SPA NAVIGATOR UTAMA (MASTER CONTROLLER ROUTER)
         ==================================================================== */
      function navigatePage(pageTarget, pageTitle) {
        if (!currentUser && pageTarget !== 'Page_Login') {
          showLoginPage();
          return;
        }

        runProgressBar('Memuat Halaman ' + (pageTitle || pageTarget) + '...', 350, function() {
          google.script.run
            .withSuccessHandler(function(htmlContent) {
              const container = document.getElementById('mainContent');
              container.innerHTML = htmlContent;

              Array.from(container.querySelectorAll('script')).forEach(oldScript => {
                const newScript = document.createElement('script');
                Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                oldScript.parentNode.replaceChild(newScript, oldScript);
              });

              if (pageTarget === 'Dashboard' || pageTitle === 'Dashboard') {
                loadDashboardGrid();
              } else if (pageTarget === 'Page_Menu' || pageTitle === 'Master Data Menu') {
                loadMenuDataPage(); 
              } else if (pageTarget === 'Page_Management' || pageTitle === 'Login Management') {
                loadUserDataPage(); 
              }
            })
            .loadPage(pageTarget, pageTitle);
        });
      }

      function refreshAllDynamicMenus() {
        google.script.run
          .withSuccessHandler(function(data) {
            globalActiveMenus = data;
            renderSettingsDropdown(data.settingsMenus);
            loadDashboardGrid();
          })
          .getActiveDashboardMenus();
      }

      function isMenuAllowedForUser(menuTitle) {
        if (!currentUser || !currentUser.permissions) return true;
        try {
          const perms = JSON.parse(currentUser.permissions || '{}');
          if (perms[menuTitle] === 'Sembunyikan') {
            return false;
          }
        } catch(e) {}
        return true;
      }

      function renderSettingsDropdown(settingsData) {
        const container = document.getElementById('settingsMenu');
        if (!container) return;
        
        const allowedSettings = (settingsData || []).filter(item => isMenuAllowedForUser(item.title));

        if (allowedSettings.length === 0) {
          container.innerHTML = `<div style="padding:10px; font-size:0.8rem;">Menu tidak tersedia.</div>`;
          return;
        }

        let html = '';
        allowedSettings.forEach(item => {
          const isDanger = item.title === 'Reset Password' ? 'class="text-danger"' : '';
          const divider = item.title === 'Reset Password' ? '<div class="menu-divider"></div>' : '';
          
          html += `${divider}<a href="javascript:void(0)" onclick="handleMenuClick('${item.title}', '${item.pageTarget}')" ${isDanger}><i class="${item.icon}"></i> ${item.title}</a>`;
        });
        container.innerHTML = html;
      }

      function loadDashboardGrid() {
        const gridContainer = document.getElementById('dynamicGridContainer');
        if (!gridContainer) return;

        const gridData = (globalActiveMenus.gridMenus || []).filter(item => isMenuAllowedForUser(item.title));

        if (gridData.length === 0) {
          gridContainer.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; font-weight:700;">Tidak ada menu aktif yang dapat Anda akses.</div>`;
          return;
        }

        gridContainer.innerHTML = gridData.map(item => {
          const bgHex = (item.color && item.color.startsWith('#')) ? item.color : '#FFDE59';
          return `
            <div class="card-item" style="--brutal-color: ${bgHex};" onclick="handleMenuClick('${item.title}', '${item.pageTarget}')">
              <div class="card-icon"><i class="${item.icon}"></i></div>
              <div class="card-title">${item.title}</div>
              <i class="${item.icon} card-watermark"></i>
            </div>
          `;
        }).join('');
      }

      function handleMenuClick(moduleName, pageTarget) {
        const settingsMenu = document.getElementById('settingsMenu');
        if (settingsMenu) settingsMenu.classList.remove('show');
        navigatePage(pageTarget, moduleName);
      }

      function toggleSettingsMenu(event) {
        event.stopPropagation();
        document.getElementById('settingsMenu').classList.toggle('show');
      }

      window.addEventListener('click', function(event) {
        const dropdownContainer = document.querySelector('.settings-dropdown');
        const settingsMenu = document.getElementById('settingsMenu');
        if (dropdownContainer && !dropdownContainer.contains(event.target)) {
          if (settingsMenu && settingsMenu.classList.contains('show')) {
            settingsMenu.classList.remove('show');
          }
        }
      });

      /* ====================================================================
         KONTROLLER MASTER DATA MENU
         ==================================================================== */
      let activeMenuTab = 'GRID';

      function loadMenuDataPage() {
        loadMenuDataWithProgress();
      }

      function switchMenuTab(tabName) {
        activeMenuTab = tabName;
        const btnGrid = document.getElementById('tabBtnGrid');
        const btnSettings = document.getElementById('tabBtnSettings');
        if (btnGrid && btnSettings) {
          if (tabName === 'GRID') {
            btnGrid.classList.add('active');
            btnSettings.classList.remove('active');
          } else {
            btnSettings.classList.add('active');
            btnGrid.classList.remove('active');
          }
        }
        const saveBtn = document.getElementById('saveOrderBtn');
        if (saveBtn) saveBtn.style.display = 'none';

        filterAndRenderTable();
      }

      function loadMenuDataWithProgress() {
        runProgressBar('Memuat Data Menu...', 350, function() {
          google.script.run
            .withSuccessHandler(function(data) {
              menuDataList = data || [];
              const saveBtn = document.getElementById('saveOrderBtn');
              if (saveBtn) saveBtn.style.display = 'none';
              filterAndRenderTable();
            })
            .getAllMenus();
        });
      }

      function filterAndRenderTable() {
        const searchInput = document.getElementById('searchInput');
        const sortSelect = document.getElementById('sortSelect');
        const query = searchInput ? (searchInput.value || '').toLowerCase().trim() : '';
        const sortType = sortSelect ? sortSelect.value : 'DATE';

        let filtered = menuDataList.filter(item => item.location === activeMenuTab);

        if (query) {
          filtered = filtered.filter(item => 
            item.title.toLowerCase().includes(query) ||
            (item.pageTarget && item.pageTarget.toLowerCase().includes(query)) ||
            item.status.toLowerCase().includes(query)
          );
        }

        if (sortType === 'AZ') {
          filtered.sort((a, b) => a.title.localeCompare(b.title));
        } else if (sortType === 'ZA') {
          filtered.sort((a, b) => b.title.localeCompare(a.title));
        } else {
          filtered.sort((a, b) => a.order - b.order);
        }

        renderMenuTableHtml(filtered);
      }

      function renderMenuTableHtml(data) {
        const tbody = document.getElementById('menuTableBody');
        if (!tbody) return;
        
        if(data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; padding: 25px;">Belum ada menu di tab ${activeMenuTab}.</td></tr>`;
          return;
        }

        tbody.innerHTML = data.map((item, index) => `
          <tr draggable="true" data-id="${item.id}" data-index="${index}">
            <td class="drag-handle" title="Klik & Geser untuk mengubah urutan"><i class="fa-solid fa-grip-vertical"></i></td>
            <td><i class="${item.icon}" style="font-size: 1.2rem;"></i></td>
            <td><b>${item.title}</b></td>
            <td><code>${item.pageTarget || '-'}</code></td>
            <td><div class="color-preview-box" style="background-color: ${item.color}"></div></td>
            <td><span class="badge-status ${item.status === 'AKTIF' ? 'badge-aktif' : 'badge-nonaktif'}">${item.status}</span></td>
            <td>
              <div class="action-btn-group">
                <button class="btn-action" style="background:#fef08a; color:#854d0e;" onclick="editMenu('${item.id}')" title="Edit"><i class="fa-solid fa-pen-to-square"></i></button>
                <button class="btn-action" style="background:#fecaca; color:#991b1b;" onclick="deleteMenu('${item.id}')" title="Hapus"><i class="fa-solid fa-trash"></i></button>
              </div>
            </td>
          </tr>
        `).join('');

        initTableDragAndDrop();
      }

      function initTableDragAndDrop() {
        const rows = document.querySelectorAll('#menuTableBody tr[draggable="true"]');
        let draggedRow = null;

        rows.forEach(row => {
          row.addEventListener('dragstart', function(e) {
            draggedRow = this;
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
          });

          row.addEventListener('dragover', function(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            const tbody = document.getElementById('menuTableBody');
            const targetRow = e.target.closest('tr');
            if (targetRow && targetRow !== draggedRow && targetRow.parentElement === tbody) {
              const targetRect = targetRow.getBoundingClientRect();
              const next = (e.clientY - targetRect.top) / (targetRect.bottom - targetRect.top) > 0.5;
              tbody.insertBefore(draggedRow, next ? targetRow.nextSibling : targetRow);
            }
          });

          row.addEventListener('dragend', function() {
            this.classList.remove('dragging');
            const saveBtn = document.getElementById('saveOrderBtn');
            if (saveBtn) saveBtn.style.display = 'inline-flex';
          });
        });
      }

      function saveDraggedOrder() {
        const newRows = document.querySelectorAll('#menuTableBody tr[data-id]');
        const orderedIds = Array.from(newRows).map(r => r.getAttribute('data-id'));

        runProgressBar('Menyimpan Urutan Baru...', 500, function() {
          google.script.run
            .withSuccessHandler(function(res) {
              showToast(res.message);
              const saveBtn = document.getElementById('saveOrderBtn');
              if (saveBtn) saveBtn.style.display = 'none';
              refreshAllDynamicMenus();
              loadMenuDataWithProgress();
            })
            .saveMenuOrder(orderedIds);
        });
      }

      function previewIcon() {
        const iconClass = document.getElementById('menuIcon').value;
        const preview = document.getElementById('iconPreview');
        if (preview) preview.className = iconClass || 'fa-solid fa-box';
      }

      function openMenuModal() {
        const form = document.getElementById('menuForm');
        if (form) form.reset();
        document.getElementById('menuId').value = '';
        const menuLoc = document.getElementById('menuLocation');
        if (menuLoc) menuLoc.value = activeMenuTab;
        document.getElementById('modalTitle').innerText = 'TAMBAH MENU BARU';
        document.getElementById('menuModal').classList.add('show');
      }

      function closeMenuModal() {
        document.getElementById('menuModal').classList.remove('show');
      }

      function editMenu(id) {
        const item = menuDataList.find(m => m.id === id);
        if(!item) return;

        document.getElementById('menuId').value = item.id;
        document.getElementById('menuTitle').value = item.title;
        document.getElementById('menuIcon').value = item.icon;
        document.getElementById('menuLocation').value = item.location;
        document.getElementById('menuTarget').value = item.pageTarget || '';
        document.getElementById('menuColor').value = item.color;
        document.getElementById('menuStatus').value = item.status;
        
        previewIcon();
        document.getElementById('modalTitle').innerText = 'EDIT MENU';
        document.getElementById('menuModal').classList.add('show');
      }

      function saveMenu(e) {
        e.preventDefault();
        const payload = {
          id: document.getElementById('menuId').value,
          title: document.getElementById('menuTitle').value,
          icon: document.getElementById('menuIcon').value,
          location: document.getElementById('menuLocation').value,
          pageTarget: document.getElementById('menuTarget').value,
          color: document.getElementById('menuColor').value,
          status: document.getElementById('menuStatus').value
        };

        closeMenuModal();
        runProgressBar('Menyimpan Data Menu...', 450, function() {
          google.script.run
            .withSuccessHandler(function(res) {
              showToast(res.message);
              refreshAllDynamicMenus();
              loadMenuDataWithProgress();
            })
            .saveMenuData(payload);
        });
      }

      function deleteMenu(id) {
        showCustomConfirm("Konfirmasi Hapus Menu", "Apakah Anda yakin ingin menghapus menu ini dari database?", function() {
          runProgressBar('Menghapus Menu...', 450, function() {
            google.script.run
              .withSuccessHandler(function(res) {
                showToast(res.message);
                refreshAllDynamicMenus();
                loadMenuDataWithProgress();
              })
              .deleteMenuData(id);
          });
        });
      }

      /* ====================================================================
         KONTROLLER LOGIN MANAGEMENT
         ==================================================================== */
      function togglePasswordVisibility() {
        const passInput = document.getElementById('userPassword');
        const passIcon = document.getElementById('togglePassIcon');
        if (!passInput) return;
        if (passInput.type === 'password') {
          passInput.type = 'text';
          if (passIcon) passIcon.className = 'fa-solid fa-eye-slash toggle-eye';
        } else {
          passInput.type = 'password';
          if (passIcon) passIcon.className = 'fa-solid fa-eye toggle-eye';
        }
      }

      function loadUserDataPage() {
        loadUserDataWithProgress();
      }

      function loadUserDataWithProgress() {
        runProgressBar('Memuat Data Pengguna...', 350, function() {
          if (!menuDataList || menuDataList.length === 0) {
            google.script.run.withSuccessHandler(function(m) { menuDataList = m || []; }).getAllMenus();
          }

          google.script.run
            .withSuccessHandler(function(data) {
              rawUserList = data || [];
              filterUserTable();
            })
            .withFailureHandler(function(err) {
              showToast('Gagal memuat pengguna: ' + err.message);
              const tbody = document.getElementById('userTableBody');
              if (tbody) tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: red; padding: 20px;">Gagal memuat data dari server. Silakan klik Refresh.</td></tr>`;
            })
            .getAllUsers();
        });
      }

      function filterUserTable() {
        const searchInput = document.getElementById('searchUserInput');
        const query = searchInput ? (searchInput.value || '').toLowerCase().trim() : '';
        let filtered = rawUserList;

        if (query) {
          filtered = filtered.filter(u => 
            u.name.toLowerCase().includes(query) ||
            u.username.toLowerCase().includes(query) ||
            u.id.toLowerCase().includes(query)
          );
        }

        renderUserTableHtml(filtered);
      }

      function renderUserTableHtml(data) {
        const tbody = document.getElementById('userTableBody');
        if (!tbody) return;
        
        if(data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; padding: 25px;">Pengguna tidak ditemukan.</td></tr>`;
          return;
        }

        tbody.innerHTML = data.map(item => `
          <tr>
            <td><b>${item.id}</b></td>
            <td><b>${item.name}</b></td>
            <td>${item.username}</td>
            <td><span class="badge-status ${item.status === 'AKTIF' ? 'badge-aktif' : 'badge-nonaktif'}">${item.status}</span></td>
            <td style="opacity:0.7; font-size:0.75rem;">${item.lastLogin}</td>
            <td>
              <div class="action-btn-group">
                <button class="btn-action" style="background:#fef08a; color:#854d0e;" onclick="editUser('${item.id}')" title="Edit Pengguna"><i class="fa-solid fa-pen-to-square"></i></button>
                <button class="btn-action" style="background:#fecaca; color:#991b1b;" onclick="deleteUser('${item.id}')" title="Hapus Pengguna"><i class="fa-solid fa-trash"></i></button>
              </div>
            </td>
          </tr>
        `).join('');
      }

      function renderPermissionsForm(savedPermissionsJson) {
        const container = document.getElementById('permissionsContainer');
        if (!container) return;

        let userPerms = {};
        try {
          userPerms = JSON.parse(savedPermissionsJson || '{}');
        } catch(e) { userPerms = {}; }

        const allMenus = menuDataList || [];
        if (allMenus.length === 0) {
          container.innerHTML = `<div style="text-align:center; font-size:0.8rem;">Belum ada menu di Master Data Menu.</div>`;
          return;
        }

        container.innerHTML = allMenus.map(menu => {
          const currentVal = userPerms[menu.title] || 'Tampilkan';
          return `
            <div class="perm-item">
              <span><i class="${menu.icon}"></i> ${menu.title}</span>
              <select class="form-control user-perm-select" data-menutitle="${menu.title}" style="width: 130px; padding: 4px 8px; font-size: 0.78rem;">
                <option value="Tampilkan" ${currentVal === 'Tampilkan' ? 'selected' : ''}>Tampilkan</option>
                <option value="Sembunyikan" ${currentVal === 'Sembunyikan' ? 'selected' : ''}>Sembunyikan</option>
              </select>
            </div>
          `;
        }).join('');
      }

      function openUserModal() {
        const form = document.getElementById('userForm');
        if (form) form.reset();
        document.getElementById('userId').value = '';
        
        const passInput = document.getElementById('userPassword');
        if (passInput) passInput.type = 'password';
        const passIcon = document.getElementById('togglePassIcon');
        if (passIcon) passIcon.className = 'fa-solid fa-eye toggle-eye';

        renderPermissionsForm('{}');
        document.getElementById('userModalTitle').innerText = 'TAMBAH USER BARU';
        document.getElementById('userModal').classList.add('show');
      }

      function closeUserModal() {
        document.getElementById('userModal').classList.remove('show');
      }

      function editUser(id) {
        const item = rawUserList.find(u => u.id === id);
        if(!item) return;

        document.getElementById('userId').value = item.id;
        document.getElementById('userName').value = item.name;
        document.getElementById('userEmail').value = item.username;
        document.getElementById('userPassword').value = item.password || '';
        
        const passInput = document.getElementById('userPassword');
        if (passInput) passInput.type = 'password';
        const passIcon = document.getElementById('togglePassIcon');
        if (passIcon) passIcon.className = 'fa-solid fa-eye toggle-eye';

        document.getElementById('userStatus').value = item.status;
        
        renderPermissionsForm(item.permissions);
        document.getElementById('userModalTitle').innerText = 'EDIT USER';
        document.getElementById('userModal').classList.add('show');
      }

      function saveUser(e) {
        e.preventDefault();
        
        const permSelects = document.querySelectorAll('.user-perm-select');
        const permsObj = {};
        permSelects.forEach(sel => {
          const menuTitle = sel.getAttribute('data-menutitle');
          permsObj[menuTitle] = sel.value;
        });

        const payload = {
          id: document.getElementById('userId').value,
          name: document.getElementById('userName').value,
          username: document.getElementById('userEmail').value,
          password: document.getElementById('userPassword').value,
          permissions: JSON.stringify(permsObj),
          status: document.getElementById('userStatus').value
        };

        closeUserModal();
        runProgressBar('Menyimpan Data Pengguna...', 450, function() {
          google.script.run
            .withSuccessHandler(function(res) {
              showToast(res.message);
              loadUserDataWithProgress();
            })
            .saveUserData(payload);
        });
      }

      function deleteUser(id) {
        showCustomConfirm("Hapus Akses Pengguna", "Apakah Anda yakin ingin mencabut akses dan menghapus pengguna ini?", function() {
          runProgressBar('Menghapus Data...', 450, function() {
            google.script.run
              .withSuccessHandler(function(res) {
                showToast(res.message);
                loadUserDataWithProgress();
              })
              .deleteUserData(id);
          });
        });
      }

      /* ====================================================================
         KONTROLLER MASTER DATA KARYAWAN (PAGINATION 10, 20, 50, 100)
         ==================================================================== */
      let karyawanCurrentPage = 1;
      let karyawanRowsPerPage = 10;

      function loadKaryawanDataPage() {
        loadKaryawanDataWithProgress();
      }

      function loadKaryawanDataWithProgress() {
        runProgressBar('Memuat Data Karyawan...', 350, function() {
          google.script.run
            .withSuccessHandler(function(data) {
              rawKaryawanList = data || [];
              filterKaryawanTable();
            })
            .withFailureHandler(function(err) {
              showToast('Gagal memuat karyawan: ' + err.message);
              const tbody = document.getElementById('karyawanTableBody');
              if (tbody) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: red; padding: 20px;">Gagal memuat data dari server. Silakan klik Refresh.</td></tr>`;
              }
            })
            .getAllKaryawan();
        });
      }

      function onKaryawanSearchInput() {
        karyawanCurrentPage = 1;
        filterKaryawanTable();
      }

      function onKaryawanFilterChange() {
        karyawanCurrentPage = 1;
        filterKaryawanTable();
      }

      function onKaryawanLimitChange() {
        const limitSelect = document.getElementById('limitKaryawan');
        if (limitSelect) {
          karyawanRowsPerPage = parseInt(limitSelect.value) || 10;
        }
        karyawanCurrentPage = 1;
        filterKaryawanTable();
      }

      function changeKaryawanPage(newPage) {
        karyawanCurrentPage = newPage;
        filterKaryawanTable();
      }

      function filterKaryawanTable() {
        const searchInput = document.getElementById('searchKaryawanInput');
        const deptSelect = document.getElementById('filterDept');

        const query = searchInput ? (searchInput.value || '').toLowerCase().trim() : '';
        const deptFilter = deptSelect ? deptSelect.value : 'ALL';

        let filtered = rawKaryawanList || [];

        if (deptFilter !== 'ALL') {
          filtered = filtered.filter(k => k.departemen === deptFilter);
        }

        if (query) {
          filtered = filtered.filter(k => 
            k.nik.toLowerCase().includes(query) ||
            k.nama.toLowerCase().includes(query) ||
            k.jabatan.toLowerCase().includes(query)
          );
        }

        const totalItems = filtered.length;
        const totalPages = Math.ceil(totalItems / karyawanRowsPerPage) || 1;

        if (karyawanCurrentPage > totalPages) karyawanCurrentPage = totalPages;
        if (karyawanCurrentPage < 1) karyawanCurrentPage = 1;

        const startIndex = (karyawanCurrentPage - 1) * karyawanRowsPerPage;
        const pagedData = filtered.slice(startIndex, startIndex + karyawanRowsPerPage);

        renderKaryawanTableHtml(pagedData);
        renderKaryawanPagination(totalItems, totalPages);
      }

      function renderKaryawanTableHtml(data) {
        const tbody = document.getElementById('karyawanTableBody');
        if (!tbody) return;
        
        if(data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; padding: 25px;">Data karyawan tidak ditemukan.</td></tr>`;
          return;
        }

        tbody.innerHTML = data.map(item => `
          <tr>
            <td><b>${item.nik}</b></td>
            <td><b>${item.nama}</b></td>
            <td><span class="badge-dept">${item.departemen}</span></td>
            <td>${item.jabatan}</td>
            <td>
              <div style="font-size:0.75rem; line-height:1.4;">
                <i class="fa-solid fa-envelope" style="opacity:0.6; width:14px;"></i> ${item.email}<br>
                <i class="fa-solid fa-phone" style="opacity:0.6; width:14px;"></i> ${item.hp}
              </div>
            </td>
            <td><span class="badge-status ${item.status === 'AKTIF' ? 'badge-aktif' : 'badge-nonaktif'}">${item.status}</span></td>
            <td>
              <div class="action-btn-group">
                <button class="btn-action" style="background:#fef08a; color:#854d0e;" onclick="editKaryawan('${item.id}')" title="Edit Karyawan"><i class="fa-solid fa-pen-to-square"></i></button>
                <button class="btn-action" style="background:#fecaca; color:#991b1b;" onclick="deleteKaryawan('${item.id}')" title="Hapus Karyawan"><i class="fa-solid fa-trash"></i></button>
              </div>
            </td>
          </tr>
        `).join('');
      }

      function renderKaryawanPagination(totalItems, totalPages) {
        const infoEl = document.getElementById('karyawanPaginationInfo');
        const btnsEl = document.getElementById('karyawanPaginationBtns');

        if (!infoEl || !btnsEl) return;

        if (totalItems === 0) {
          infoEl.innerHTML = `Menampilkan 0 dari 0 data`;
          btnsEl.innerHTML = '';
          return;
        }

        const start = (karyawanCurrentPage - 1) * karyawanRowsPerPage + 1;
        const end = Math.min(karyawanCurrentPage * karyawanRowsPerPage, totalItems);

        infoEl.innerHTML = `Menampilkan <b>${start} - ${end}</b> dari <b>${totalItems}</b> data`;

        let btnsHtml = '';

        const isPrevDisabled = karyawanCurrentPage === 1 ? 'disabled' : '';
        btnsHtml += `<button class="page-btn ${isPrevDisabled}" onclick="changeKaryawanPage(${karyawanCurrentPage - 1})"><i class="fa-solid fa-chevron-left"></i> Prev</button>`;

        for (let i = 1; i <= totalPages; i++) {
          const isActive = i === karyawanCurrentPage ? 'active' : '';
          btnsHtml += `<button class="page-btn ${isActive}" onclick="changeKaryawanPage(${i})">${i}</button>`;
        }

        const isNextDisabled = karyawanCurrentPage === totalPages ? 'disabled' : '';
        btnsHtml += `<button class="page-btn ${isNextDisabled}" onclick="changeKaryawanPage(${karyawanCurrentPage + 1})">Next <i class="fa-solid fa-chevron-right"></i></button>`;

        btnsEl.innerHTML = btnsHtml;
      }

      function openKaryawanModal() {
        const form = document.getElementById('karyawanForm');
        if (form) form.reset();
        document.getElementById('empId').value = '';
        document.getElementById('karyawanModalTitle').innerText = 'TAMBAH KARYAWAN BARU';
        document.getElementById('karyawanModal').classList.add('show');
      }

      function closeKaryawanModal() {
        document.getElementById('karyawanModal').classList.remove('show');
      }

      function editKaryawan(id) {
        const item = rawKaryawanList.find(k => k.id === id);
        if(!item) return;

        document.getElementById('empId').value = item.id;
        document.getElementById('empNik').value = item.nik;
        document.getElementById('empNama').value = item.nama;
        document.getElementById('empDept').value = item.departemen;
        document.getElementById('empJabatan').value = item.jabatan;
        document.getElementById('empEmail').value = item.email;
        document.getElementById('empHp').value = item.hp;
        document.getElementById('empStatus').value = item.status;
        
        document.getElementById('karyawanModalTitle').innerText = 'EDIT DATA KARYAWAN';
        document.getElementById('karyawanModal').classList.add('show');
      }

      function saveKaryawan(e) {
        e.preventDefault();
        
        const payload = {
          id: document.getElementById('empId').value,
          nik: document.getElementById('empNik').value,
          nama: document.getElementById('empNama').value,
          departemen: document.getElementById('empDept').value,
          jabatan: document.getElementById('empJabatan').value,
          email: document.getElementById('empEmail').value,
          hp: document.getElementById('empHp').value,
          status: document.getElementById('empStatus').value
        };

        closeKaryawanModal();
        runProgressBar('Menyimpan Data Karyawan...', 450, function() {
          google.script.run
            .withSuccessHandler(function(res) {
              showToast(res.message);
              loadKaryawanDataWithProgress();
            })
            .saveKaryawanData(payload);
        });
      }

      function deleteKaryawan(id) {
        showCustomConfirm("Hapus Data Karyawan", "Apakah Anda yakin ingin menghapus data karyawan ini dari sistem?", function() {
          runProgressBar('Menghapus Data...', 450, function() {
            google.script.run
              .withSuccessHandler(function(res) {
                showToast(res.message);
                loadKaryawanDataWithProgress();
              })
              .deleteKaryawanData(id);
          });
        });
      }
    </script>
  </body>
</html>
